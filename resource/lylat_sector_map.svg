<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Yu Gothic UI','Meiryo','MS Gothic',sans-serif">
  <defs>
    <!-- hatch pattern for hazard regions -->
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="rgba(255,140,60,0.06)"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="rgba(255,150,70,0.35)" stroke-width="2"/>
    </pattern>
    <pattern id="hatch2" width="8" height="8" patternTransform="rotate(-30)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="rgba(210,190,140,0.05)"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(210,190,140,0.4)" stroke-width="1.4"/>
    </pattern>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>
  </defs>

  <!-- ═══ background ═══ -->
