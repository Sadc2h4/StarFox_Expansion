  <text x="180" y="368" fill="#7fb2ff" font-size="20" text-anchor="middle">α</text>

  <!-- β Corneria -->
  <circle cx="420" cy="420" r="80" fill="rgba(0,212,180,0.13)" stroke="rgba(0,230,200,0.55)" stroke-width="1.5"/>
  <text x="420" y="330" fill="#3fe0c8" font-size="20" text-anchor="middle">β</text>

  <!-- γ Katina / GW1 -->
