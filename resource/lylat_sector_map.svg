    <!-- Titania (forbidden) -->
    <circle cx="1130" cy="420" r="10" fill="#b0642f" stroke="#e0a070" stroke-width="1.5"/>
    <text x="1130" y="452" fill="#f0b98a">タイタニア ②</text>
    <!-- Venom -->
