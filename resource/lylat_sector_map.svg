  <path d="M 385 525 A 210 210 0 0 0 610 705" fill="none" stroke="rgba(210,190,140,0.55)" stroke-width="1.2" stroke-dasharray="3 6"/>
  <text x="428" y="595" fill="#d8c890" font-size="20">δ</text>

