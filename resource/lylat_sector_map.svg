    <text x="1390" y="446" fill="#ffc4cc">ベノム ①</text>
    <circle cx="1370" cy="452" r="3.5" fill="#ff8090"/>
    <circle cx="1412" cy="486" r="3.5" fill="#ff8090"/>
    <text x="1348" y="444" fill="rgba(255,150,165,0.85)" font-size="10" text-anchor="end">ゴモラ</text>
    <text x="1424" y="498" fill="rgba(255,150,165,0.85)" font-size="10">ソドム</text>
    <!-- Eladard -->
    <circle cx="1252" cy="880" r="9" fill="#ffbb44" stroke="#ffe0a0" stroke-width="1.5"/>
    <text x="1196" y="885" fill="#ffe0aa" text-anchor="end">エラダード ⑪</text>
    <!-- Kew -->
    <circle cx="1430" cy="880" r="9" fill="#ffbb44" stroke="#ffe0a0" stroke-width="1.5"/>
    <text x="1448" y="885" fill="#ffd8f2" text-anchor="start">キュー ⑨</text>
    <!-- Papetoon -->
    <circle cx="1340" cy="748" r="9" fill="#37d0b2" stroke="#ffbb44" stroke-width="2.5"/>
    <text x="1279" y="752" fill="#e8cfa8" text-anchor="end">パペトゥーン ⑭</text>
    <!-- Grippia -->
    <circle cx="1510" cy="640" r="9" fill="#9aa7b0" stroke="#a8e6cf" stroke-width="1.5"/>
    <text x="1510" y="670" fill="#bfe8d8">グリッピア ⑮</text>
  </g>

  <!-- structures: ◆ -->
