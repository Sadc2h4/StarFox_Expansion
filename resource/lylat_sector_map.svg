    <circle cx="670" cy="508" r="2.5" fill="#aeb6ff"/><circle cx="676" cy="522" r="2.5" fill="#aeb6ff"/><circle cx="666" cy="534" r="2.5" fill="#aeb6ff"/>
    <text x="650" y="558" fill="#c6ccff">艦隊スターブレード</text>
    <!-- Oberon -->
