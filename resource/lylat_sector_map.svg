  <!-- ═══ title ═══ -->
  <g>
    <text x="40" y="58" fill="#e8fff8" font-size="30" font-weight="bold" letter-spacing="4">LYLAT SYSTEM ─ SCHEMATIC SECTOR MAP</text>
    <text x="40" y="86" fill="#57c9b4" font-size="15" letter-spacing="6">ライラット星系 簡易セクター図 ── CDF参謀本部 戦術資料</text>
    <line x1="40" y1="100" x2="740" y2="100" stroke="rgba(0,212,180,0.4)" stroke-width="1"/>
