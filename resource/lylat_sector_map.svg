    <text x="86" y="795">帝国圏・占領地</text>
    <circle cx="196" cy="790" r="7" fill="#ffbb44"/>
    <text x="212" y="795">通商連合圏</text>

    <circle cx="66" cy="820" r="7" fill="#9aa7b0"/>
