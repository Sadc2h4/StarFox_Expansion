    <circle cx="196" cy="820" r="7" fill="#37d0b2" stroke="#ff5566" stroke-width="2.5"/>
    <text x="212" y="825">係争中</text>

    <rect x="59" y="843" width="14" height="14" transform="rotate(45 66 850)" fill="none" stroke="#98a8ff" stroke-width="2"/>
    <text x="86" y="855">軍事拠点・ステーション</text>

    <line x1="56" y1="880" x2="76" y2="880" stroke="rgba(255,110,125,0.7)" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="86" y="885">防衛ライン</text>
    <rect x="190" y="872" width="22" height="15" fill="url(#hatch)" stroke="rgba(255,150,70,0.5)" stroke-width="0.8"/>
