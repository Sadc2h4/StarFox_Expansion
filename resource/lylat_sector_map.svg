    <line x1="56" y1="910" x2="76" y2="910" stroke="rgba(0,220,190,0.5)" stroke-width="1.6" stroke-dasharray="2 5"/>
    <text x="86" y="915">ワープドライブ航路（主要）</text>

    <text x="56" y="944" fill="rgba(160,200,190,0.75)" font-size="11">円=セクター境界（ギリシャ文字=セクター名）</text>
    <text x="56" y="960" fill="rgba(160,200,190,0.6)" font-size="10.5">※未観測セクター（η κ π ρ τ ϡ）は記載省略</text>
  </g>

  <!-- footer -->
  <text x="1560" y="978" fill="rgba(120,160,150,0.55)" font-size="11" text-anchor="end">SOURCE: sector_info — GENERAL STAFF ARCHIVE / NOT TO SCALE</text>
</svg>
