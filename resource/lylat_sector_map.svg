    <text x="950" y="180" fill="#cdb2ff">オベロンⅡ (廃棄)</text>
    <!-- Area6 + Bolse on ψ ring -->
    <rect x="1322" y="536" width="16" height="16" transform="rotate(45 1330 544)" fill="none" stroke="#ff8090" stroke-width="2.5"/>
    <text x="1310" y="578" fill="#ffaab6">AREA6</text>
    <circle cx="1462" cy="418" r="7" fill="none" stroke="#ff8090" stroke-width="2"/>
    <circle cx="1462" cy="418" r="2.5" fill="#ff8090"/>
    <text x="1492" y="404" fill="#ffaab6">ボルス</text>
    <!-- Great Wall label -->
    <text x="452" y="668" fill="rgba(216,200,144,0.9)" font-size="12" transform="rotate(40 452 668)">グレートウォール (第6惑星跡)</text>
    <!-- Sargasso label -->
    <text x="1178" y="580" fill="rgba(255,160,100,0.9)" font-size="13" transform="rotate(24 1178 580)">サルガッソー宙域</text>
